<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blog</title>
</head>
<body>
    <nav>
        <a href="/">Main</a> |
        <a href="/blog">Blog</a>
    </nav>
    <ul>
        <li th:each="post : ${posts}">
            <a th:href="@{/blog/{id}(id=${post.id})}" th:text="${post.title}"></a>
        </li>
    </ul>
</body>
</html>
